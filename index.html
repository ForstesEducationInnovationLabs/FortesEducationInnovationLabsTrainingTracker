<!doctype html>
<html lang="en"><head>
    <script>
      (function() {
        // Capture host references before any artifact code runs: Window.parent
        // is [Replaceable] (a top-level `var parent` in artifact code would
        // replace the accessor with a data property), and a top-level
        // `const crypto` would shadow the global — either would otherwise
        // silently break the bridge for artifacts that worked before.
        const realParent = window.parent;
        const cryptoObj = window.crypto;
        const RealURL = URL;
        const realDecodeURIComponent = decodeURIComponent;
        // html-to-image is only used by takeScreenshot: fetched on first use, not as a
        // parser-blocking tag. Native fetch, captured before the proxy override below.
        const realFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
        const HTML_TO_IMAGE_SRC = "https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js";
        const HTML_TO_IMAGE_INTEGRITY = "sha512-iZ2ORl595Wx6miw+GuadDet4WQbdSWS3JLMoNfY8cRGoEFy6oT3G9IbcrBeL6AfkgpA51ETt/faX6yLV+/gFJg==";
        let htmlToImageLoad = null;
        const loadHtmlToImage = () => {
          if (!htmlToImageLoad) {
            htmlToImageLoad = (realFetch
              ? realFetch(HTML_TO_IMAGE_SRC, { integrity: HTML_TO_IMAGE_INTEGRITY, credentials: 'omit', referrerPolicy: 'no-referrer' })
              : Promise.reject(new Error('fetch unavailable'))
            )
              .then((res) => {
                if (!res.ok) throw new Error('html-to-image failed to load (' + res.status + ')');
                return res.text();
              })
              .then((source) => {
                // UMD bundle: hide the artifact's AMD/CommonJS globals so it takes the
                // window-global branch; inline script text runs synchronously on insert.
                const hidden = ['define', 'module', 'exports'].map((k) => {
                  const entry = { k, own: Object.prototype.hasOwnProperty.call(window, k), v: window[k] };
                  try { window[k] = undefined; } catch (e) {}
                  return entry;
                });
                try {
                  const el = document.createElement('script');
                  el.text = source;
                  (document.head || document.documentElement).appendChild(el);
                } finally {
                  hidden.forEach(({ k, own, v }) => {
                    try { if (own) { window[k] = v; } else { delete window[k]; } } catch (e) {}
                  });
                }
                if (!window.htmlToImage) throw new Error('html-to-image unavailable after load');
                return window.htmlToImage;
              });
            // A failed load may be transient; let the next screenshot retry.
            htmlToImageLoad.catch(() => { htmlToImageLoad = null; });
          }
          return htmlToImageLoad;
        };
        // crypto.randomUUID exists only in Secure Contexts; fall back to a
        // unique non-crypto id elsewhere (http://LAN-IP dev flows) —
        // uniqueness is what the bridge needs, unpredictability is
        // defense-in-depth on top of the source guards.
        const newRequestId =
          cryptoObj && typeof cryptoObj.randomUUID === "function"
            ? function () { return cryptoObj.randomUUID(); }
            : function () { return Date.now() + "-" + Math.random(); };
        const originalConsole = window.console;
        window.console = {
          log: (...args) => {
            originalConsole.log(...args);
            realParent.postMessage({ type: 'console', message: args.join(' ') }, '*');
          },
          error: (...args) => {
            originalConsole.error(...args);
            realParent.postMessage({ type: 'console', message: 'Error: ' + args.join(' ') }, '*');
          },
          warn: (...args) => {
            originalConsole.warn(...args);
            realParent.postMessage({ type: 'console', message: 'Warning: ' + args.join(' ') }, '*');
          }
        };

        // Bridge request ids are crypto-random (not sequential) so they
        // cannot be predicted by other frames in the tab.
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'claudeComplete', id, prompt }, '*');
            });
          }
        };

        window.storage = {
          get: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageGet', id, key, shared }, '*');
            });
          },
          set: (key, value, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });
          }
        };

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) => {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;
        };

        URL.revokeObjectURL = (url) => {
          // Remove the blob from our store
          const blobId = url.replace("blob-request://", "");
          pendingBlobs.delete(blobId);
        };

        const getBlobFromURL = (url) => {
          const blobId = url.replace("blob-request://", "");
          return pendingBlobs.get(blobId);
        };

        // Override global fetch with streaming support
        window.fetch = (url, init = {}) => {
          return new Promise((resolve, reject) => {
            const id = newRequestId();
            const channelId = `fetch-${id}-${Date.now()}`;
            
            callbacksMap.set(id, { 
              resolve: (response) => {
                // Null-body statuses: Response(stream, {status: 204}) throws
                // per the Fetch spec, which would escape this resolver and
                // hang the artifact's await forever.
                if (response.status === 204 || response.status === 205 || response.status === 304) {
                  try {
                    resolve(new Response(null, {
                      status: response.status,
                      statusText: response.statusText,
                      headers: response.headers
                    }));
                  } catch (err) {
                    // Invalid statusText/header bytes can throw here too.
                    reject(new TypeError(
                      'Bridge fetch: unconstructable response (status ' + response.status + ')'
                    ));
                  }
                  return;
                }
                // Create a ReadableStream for the response body
                const stream = new ReadableStream({
                  start(controller) {
                    streamControllers.set(channelId, controller);
                  },
                  cancel() {
                    streamControllers.delete(channelId);
                  }
                });
                
                // Create and return the Response with the stream. Response()
                // requires status in [200, 599]; an opaque/no-cors fetch
                // forwards status 0, which would throw here and escape the
                // resolver, hanging the artifact's await. Surface it as a
                // network-error-shaped rejection instead.
                try {
                  resolve(new Response(stream, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers
                  }));
                } catch (err) {
                  streamControllers.delete(channelId);
                  reject(new TypeError(
                    'Bridge fetch: unconstructable response (status ' + response.status + ')'
                  ));
                }
              },
              reject,
              channelId
            });
            
            realParent.postMessage({
              type: 'proxyFetch',
              id,
              url,
              init,
              channelId
            }, '*');
          });
        };

        window.addEventListener('message', async (event) => {
          // Only the embedding parent may drive the bridge — sibling and
          // nested frames can also postMessage into this window.
          if (event.source !== realParent) return;
          if (event.data.type === 'takeScreenshot') {
            // Echo the request's nonce so the requester can correlate the
            // reply to ITS request — a reply without the expected nonce
            // (e.g. from a stale pre-remount artifact) is ignored upstream.
            const screenshotNonce = event.data.nonce;
            const rootElement = document.getElementById('artifacts-component-root-html');
            if (!rootElement) {
              realParent.postMessage({
                type: 'screenshotError',
                nonce: screenshotNonce,
                error: new Error('Root element not found'),
              }, '*');
              return;
            }
            // Catch CDN load failures and toPng errors so the parent always
            // gets a response instead of hanging forever.
            try {
              const htmlToImage = await loadHtmlToImage();
              const screenshot = await htmlToImage.toPng(rootElement, {
                imagePlaceholder:
                  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdjePDgwX8ACOQDoNsk0PMAAAAASUVORK5CYII=",
              });
              realParent.postMessage({
                type: 'screenshotData',
                nonce: screenshotNonce,
                data: screenshot,
              }, '*');
            } catch (err) {
              realParent.postMessage({
                type: 'screenshotError',
                nonce: screenshotNonce,
                error: err instanceof Error ? err : new Error(String(err)),
              }, '*');
            }
          } else if (event.data.type === 'claudeComplete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.completion);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'proxyFetchResponse') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
              callbacksMap.delete(event.data.id);
            } else {
              // Initial response with headers, status, etc.
              callback.resolve({
                status: event.data.status,
                statusText: event.data.statusText,
                headers: event.data.headers
              });
              // Don't delete the callback yet if streaming
              if (!event.data.body) {
                callbacksMap.delete(event.data.id);
              }
            }
          } else if (event.data.type === 'proxyFetchStream') {
            // Handle streaming data chunks
            const controller = streamControllers.get(event.data.channelId);
            if (controller) {
              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) => value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        // An SVG <a> exposes href as an SVGAnimatedString; its baseVal is the attribute
        // as written, so resolve it against the base URL as the browser does for an HTML <a>.
        const resolvedHref = (linkEl) => {
          if (typeof linkEl.href === "string") return linkEl.href;
          const written = linkEl.href?.baseVal;
          // A same-document SVG link, such as one that begins an animation, stays with the browser.
          if (!written || written.trim().startsWith("#")) return "";
          try {
            return new RealURL(written, linkEl.baseURI).href;
          } catch (error) {
            return written;
          }
        };

        // This frame's URL is about:srcdoc, so the browser resolves "#id" against the renderer
        // page and would load that page in the frame instead of scrolling.
        const sameDocumentFragment = (linkEl) => {
          const written = linkEl.getAttribute("href")?.trim();
          if (!written?.startsWith("#") || document.querySelector("base[href]")) return null;
          return written.slice(1);
        };

        const scrollToFragment = (fragment) => {
          let decoded = fragment;
          try {
            decoded = realDecodeURIComponent(fragment);
          } catch (error) {}
          let target = document.getElementById(fragment) ?? document.getElementById(decoded);
          for (const named of target ? [] : document.getElementsByName(decoded)) {
            if (named.localName === "a") {
              target = named;
              break;
            }
          }
          if (target) {
            target.scrollIntoView();
          } else if (decoded.toLowerCase() === "top") {
            window.scrollTo(0, 0);
          }
        };

        window.addEventListener('click', (event) => {
          // Not instanceof Element: an artifact's own top-level class Element shadows the global.
          if (typeof event.target?.closest !== "function") return;
    
          const linkEl = event.target.closest("a");
          const href = linkEl && resolvedHref(linkEl);
          if (!href) return;

          const fragment = sameDocumentFragment(linkEl);
          if (fragment !== null) {
            const handledByArtifact = event.defaultPrevented;
            event.preventDefault();
            if (!handledByArtifact && fragment !== "") scrollToFragment(fragment);
            return;
          }
          const filename = linkEl.getAttribute("download") ?? "";
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (href.startsWith("blob-request:")) {
            const blob = getBlobFromURL(href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) => {
              realParent.postMessage({
                type: "downloadFile",
                filename,
                data,
                mimeType: blob.type || "application/octet-stream",
              });
            });
          } else if (href.startsWith("data:")) {
            const [header, base64Data] = href.split(",");
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : "application/octet-stream";
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =>
              c.charCodeAt(0),
            ).buffer;
            realParent.postMessage({
              type: "downloadFile",
              filename,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            realParent.postMessage({
              type: 'openExternal',
              href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          realParent.postMessage({
            type: "openExternal",
            href: url,
          }, "*");
        };

        window.addEventListener('error', (event) => {
          realParent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();
    </script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hands-on training tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#12213A; --mute:#5B6B84; --line:#D6DEEA; --late:#C2261B; --on:#FFFFFF;
  --c0:#00968F; --c1:#6A4CFF; --c2:#E8481F; --c3:#C98A00; --c4:#2F7BFF; --c5:#C2338A; --c6:#3C8A2E; --c7:#8A5A33;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#16213A; --ink:#E7EDF8; --mute:#9AA9C2; --line:#27385A; --late:#FF7A6E; --on:#0D1524;
    --c0:#2CCBC2; --c1:#9C86FF; --c2:#FF7A52; --c3:#F0B429; --c4:#6BA3FF; --c5:#F070B8; --c6:#6FCB5F; --c7:#D09A6A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#16213A; --ink:#E7EDF8; --mute:#9AA9C2; --line:#27385A; --late:#FF7A6E; --on:#0D1524;
  --c0:#2CCBC2; --c1:#9C86FF; --c2:#FF7A52; --c3:#F0B429; --c4:#6BA3FF; --c5:#F070B8; --c6:#6FCB5F; --c7:#D09A6A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c4);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 90px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.02em}

.head h1{font-size:clamp(34px,6vw,60px);line-height:1;font-weight:800}
.head p{margin:10px 0 0;color:var(--mute);max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:22px 0}
.spacer{flex:1}
.start{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.start input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0 0 18px}
.summary b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700;margin-right:4px}
.summary .late b{color:var(--late)}

/* route */
.route{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 46px}
.gantt{--lw:190px;position:relative}
.axis{display:grid;grid-template-columns:var(--lw) 1fr;margin-bottom:8px}
.axis-lane{position:relative;height:18px}
.axis-lane span{position:absolute;top:0;font-size:12px;color:var(--mute);padding-left:5px;white-space:nowrap}
.grows{position:relative}
.lines{position:absolute;left:var(--lw);right:0;top:0;bottom:0;pointer-events:none}
.lines i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.lines .today{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--ink)}
.lines .today span{position:absolute;bottom:-26px;left:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;white-space:nowrap}
.grow{position:relative;display:grid;grid-template-columns:var(--lw) 1fr;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0}
.grow:focus-visible{border-radius:8px}
.gtxt{padding-right:16px;min-width:0}
.gl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.grow[aria-pressed="true"] .gn{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:4px}
.gp{font-weight:600;color:var(--c);flex:none}
.gm{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.gm .late{color:var(--late);font-weight:600}
.lane{position:relative;height:32px}
.lbar{position:absolute;top:0;bottom:0;left:var(--l);width:var(--w);border-radius:10px;background:color-mix(in srgb,var(--c) 22%,var(--surface));overflow:hidden}
.lbar i{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--c);transition:width .35s}
.cap{margin:20px 0 0;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:10px 0}

/* matrix */
.sec-title{font-size:24px;font-weight:700;margin:34px 0 12px}
.scroll{overflow-x:auto}
.matrix{width:100%;border-collapse:separate;border-spacing:0 6px}
.matrix th{font-weight:500;font-size:13px;color:var(--mute);text-align:left;padding:0 8px 2px;white-space:nowrap}
.matrix th .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.matrix td{padding:0 4px}
.matrix td:first-child{padding-left:0}
.matrix .who{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;white-space:nowrap;padding-right:14px}
.cell{width:100%;min-width:74px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;position:relative;overflow:hidden}
.cell b{position:relative;font-size:16px}
.cell::before{content:"";position:absolute;left:0;bottom:0;height:5px;width:var(--w);background:var(--c,var(--ink));transition:width .35s}
.cell.all{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cell.all::before{background:var(--bg)}

/* labs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.key{font-size:13px;color:var(--mute);margin:0 0 12px;max-width:80ch}
.panel{background:var(--surface);border:1px dashed var(--mute);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.panel .people{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.panel .person{display:flex;gap:6px;align-items:center}
.panel .person .in{width:150px}
.lab{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:18px;padding:18px 20px 12px;margin-bottom:16px}
.lab-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:10px}
.lab-head h3{font-size:24px;font-weight:700}
.lab-head .meta{color:var(--mute);font-size:14px}
.lh-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;line-height:1}
.stepper .in{width:58px;text-align:center}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
.in.sm{font-size:13px;margin-top:4px}
.in.big{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--mute)}
.mini.danger{color:var(--late)}
.hbtn{background:none;border:0;padding:2px 0;font-size:13px;color:var(--mute);text-decoration:underline dotted;text-underline-offset:3px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 156px repeat(var(--np),112px) 96px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row.hd{border-top:0;font-size:13px;color:var(--mute);padding:4px 0}
.row.hd .hbtn{text-align:center}
.item b{font-weight:600;overflow-wrap:anywhere}
.item small{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.due{font-size:14px;color:var(--mute)}
.due.late{color:var(--late);font-weight:600}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.pill{width:100%;border-radius:10px;border:1px dashed var(--mute);background:transparent;padding:7px 8px;font-size:13px;font-weight:500;text-align:center;color:var(--mute);transition:background .2s}
.pill .pn{display:none;font-size:11px;opacity:.8}
.pill.s1{border:1px solid color-mix(in srgb,var(--c) 40%,var(--surface));background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink)}
.pill.s2{border:1px solid color-mix(in srgb,var(--c) 70%,var(--surface));background:color-mix(in srgb,var(--c) 38%,var(--surface));color:var(--ink)}
.pill.s3{border:1px solid var(--c);background:var(--c);color:var(--on);font-weight:600}
.addrow{padding-top:10px;border-top:1px solid var(--line)}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:14px;padding:10px 12px;margin:4px 0 12px}
.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ck input,.ckrow>input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--c);flex:none}
.ckrow{display:flex;gap:10px;align-items:flex-start}
.ckrow .fields{flex:1;min-width:0}
.row.hd .ck{font-size:13px;color:var(--mute);align-items:center}
.row.hd .ck input{margin:0}
.dbtn{background:none;border:0;padding:2px 0;color:inherit;font:inherit;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.cal{position:fixed;z-index:55;width:304px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(10,20,40,.25)}
.cal[hidden]{display:none}
.cal .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal .ch b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.cal .ch button,.cal .cf button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px}
.cal .cw,.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .cw span{font-size:11px;color:var(--mute);text-align:center;padding-bottom:4px}
.cal .cg button{aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:13px;padding:0}
.cal .cg button.we{color:var(--mute)}
.cal .cg button.win{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.cal .cg button.rg{background:color-mix(in srgb,var(--c) 34%,var(--surface))}
.cal .cg button.ed{background:var(--c);color:var(--on);font-weight:600}
.cal .cg button.td{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .cg button:hover{outline:2px solid var(--c);outline-offset:-2px}
.cal .cf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mute)}
.cal .cf .acts{display:flex;gap:6px}
.foot{margin-top:26px;font-size:13px;color:var(--mute)}

/* picker + toast */
.menu{position:fixed;z-index:50;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(10,20,40,.25)}
.menu[hidden],.toast[hidden]{display:none}
.menu .mt{font-size:12px;color:var(--mute);padding:4px 10px 6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:9px;text-align:left}
.menu button:hover,.menu button[aria-checked="true"]{background:color-mix(in srgb,var(--c,var(--ink)) 14%,var(--surface))}
.menu button[aria-checked="true"]{font-weight:600}
.sd{width:16px;height:16px;border-radius:50%;border:2px solid var(--c,var(--ink));display:inline-block;flex:none}
.sd.s0{border-style:dashed;border-color:var(--mute)}
.sd.s1{background:color-mix(in srgb,var(--c,var(--ink)) 25%,var(--surface))}
.sd.s2{background:color-mix(in srgb,var(--c,var(--ink)) 60%,var(--surface))}
.sd.s3{background:var(--c,var(--ink))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:60;max-width:92vw}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 55%,transparent);padding:5px 12px}

@media (max-width:820px){
  .route{padding-bottom:22px}
  .gantt{--lw:0px}
  .axis,.lines{display:none}
  .grow{grid-template-columns:1fr;gap:10px}
  .lbar{left:0;width:100%}
  .row{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
  .row.hd{display:none}
  .item,.due,.tools{grid-column:1/-1}
  .due{margin-top:-6px}
  .pill .pn{display:block}
}
@media (max-width:560px){
  .matrix .who{font-size:15px;padding-right:6px}
  .cell{min-width:0;padding:6px}
  .cell b{font-size:13px}
}
.filenote{margin:-10px 0 18px;font-size:13px;color:var(--mute)}
#savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:58;display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:8px 10px 8px 18px;font-weight:500;box-shadow:0 10px 30px rgba(10,20,40,.25)}
#savebar[hidden]{display:none}
body.dirty .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function calc(){
  var np=S.people.length,cur=nextWork(D(S.start)),T=todayUTC(),out=[],totalWd=0,pts=0,maxPts=0,full=0,behind=0,nItems=0;
  S.labs.forEach(function(L){
    var n=L.items.length,wd=Math.max(1,L.days),start=cur,end=addWork(start,wd-1),lp=0,lfull=0,lbehind=0,per=[],items=[],p;
    for(p=0;p<np;p++)per.push(0);
    L.items.forEach(function(it,i){
      var st=[],sum=0,min=3;
      for(p=0;p<np;p++){var v=stage(it,p);st.push(v);sum+=v;per[p]+=v;if(v<min)min=v}
      lp+=sum;
      var auto=addWork(start,Math.max(0,Math.ceil((i+1)*wd/n)-1)),due=it.due?D(it.due):auto;
      if(!it.due&&min<3&&due<T&&end>=T)due=end;
      var late=min<3&&(it.due?due<T:end<T);
      if(min===3)lfull++;
      if(late)lbehind++;
      items.push({it:it,due:due,fromD:(it.due&&it.from)?D(it.from):null,st:st,min:min,sum:sum,late:late});
    });
    var mx=3*np*n;
    out.push({L:L,start:start,end:end,wd:wd,pct:mx?lp/mx:0,full:lfull,behind:lbehind,per:per.map(function(v){return n?v/(3*n):0}),items:items,n:n});
    totalWd+=wd;pts+=lp;maxPts+=mx;full+=lfull;behind+=lbehind;nItems+=n;
    var nx=new Date(end);nx.setUTCDate(nx.getUTCDate()+1);cur=nextWork(nx);
  });
  var first=out.length?out[0].start:nextWork(D(S.start)),last=out.length?out[out.length-1].end:first,tp=null;
  if(out.length&&T>=first&&T<=last){var k=0,x=new Date(first);while(x<T){x.setUTCDate(x.getUTCDate()+1);if(wk(x)&&x<=T)k++}tp=(k+0.5)/totalWd}
  return{labs:out,first:first,last:last,today:T,tp:tp,pct:maxPts?pts/maxPts:0,full:full,behind:behind,nItems:nItems,totalWd:totalWd};
}

  var it=c.item?itemById(L,c.item):null;
  snap();
  if(c.k==="cell"&&it)setStage(it,c.p,v);
  else if(c.k==="row"&&it)S.people.forEach(function(_,p){setStage(it,p,v)});
  else if(c.k==="col")L.items.forEach(function(i2){setStage(i2,c.p,v)});
  else if(c.k==="lab")L.items.forEach(function(i2){S.people.forEach(function(_,p){setStage(i2,p,v)})});
  persist();render();
}

/* date range calendar */
var cal=document.getElementById("cal"),calCtx=null,calAnchor=null,cy=0,cm=0,cs=null,ce=null,calStep=0,cws="",cwe="";
var monFmt=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
function closeCal(){cal.hidden=true;calCtx=null;if(calAnchor&&document.body.contains(calAnchor))calAnchor.focus();calAnchor=null}
function renderCal(){
  var first=new Date(Date.UTC(cy,cm,1)),off=(first.getUTCDay()+6)%7,dim=new Date(Date.UTC(cy,cm+1,0)).getUTCDate(),T=iso(todayUTC());
  var h='<div class="ch"><button data-cal="prev" aria-label="Previous month">Prev</button><b>'+monFmt.format(first)+'</b><button data-cal="next" aria-label="Next month">Next</button></div><div class="cw">';
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(n){h+='<span>'+n+'</span>'});
  h+='</div><div class="cg">';
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=dim;d++){
    var dt=new Date(Date.UTC(cy,cm,d)),s2=iso(dt),g=dt.getUTCDay(),cls=[];
    if(g===0||g===6)cls.push("we");
    if(s2>=cws&&s2<=cwe)cls.push("win");
    if(cs&&ce&&s2>=cs&&s2<=ce)cls.push("rg");
    if(s2===cs||s2===ce)cls.push("ed");
    if(s2===T)cls.push("td");
    h+='<button class="'+cls.join(" ")+'" data-cal="day" data-d="'+s2+'" aria-label="'+fmtL.format(dt)+'">'+d+'</button>';
  }
  h+='</div><div class="cf"><span>'+(calStep===0?"Pick the first day":"Now pick the last day")+'</span><span class="acts">'
   +(calCtx&&calCtx.k==="item"?'<button data-cal="auto">Use auto dates</button>':'')+'<button data-cal="cancel">Cancel</button></span></div>';
  cal.innerHTML=h;
}
function openCal(btn,ctx){
  var C=calc(),r=null;C.labs.forEach(function(x){if(x.L.id===ctx.lab)r=x});
  cws=r?iso(r.start):"";cwe=r?iso(r.end):"";
  calCtx=ctx;calAnchor=btn;cs=ctx.from||null;ce=ctx.to||null;calStep=0;
  var base=cs?D(cs):(r?r.start:todayUTC());cy=base.getUTCFullYear();cm=base.getUTCMonth();
  var col=getComputedStyle(btn).getPropertyValue("--c");
  cal.style.setProperty("--c",col&&col.trim()?col.trim():"var(--ink)");
  cal.hidden=false;renderCal();
  var rc=btn.getBoundingClientRect(),w=cal.offsetWidth,hh=cal.offsetHeight;
  var left=Math.max(8,Math.min(rc.left,window.innerWidth-w-8)),top=rc.bottom+4;
  if(top+hh>window.innerHeight-8)top=Math.max(8,rc.top-hh-4);
  cal.style.left=left+"px";cal.style.top=top+"px";
}
function calClick(t){
  var b=t.closest("[data-cal]");if(!b)return;var a=b.getAttribute("data-cal");
  if(a==="prev"){cm--;if(cm<0){cm=11;cy--}renderCal();return}
  if(a==="next"){cm++;if(cm>11){cm=0;cy++}renderCal();return}
  if(a==="cancel"){closeCal();return}
  if(a==="auto"){
    var c0=calCtx,L0=labById(c0.lab),i0=itemById(L0,c0.item);closeCal();
    if(i0){snap();i0.from="";i0.due="";persist();render()}return;
  }
  if(a==="day"){
    var d=b.getAttribute("data-d");
    if(calStep===0){cs=d;ce=null;calStep=1;renderCal();return}
    ce=d;if(ce<cs){var tmp=cs;cs=ce;ce=tmp}
    var c=calCtx,f=cs,to=ce;closeCal();
    if(c.k==="plan"){plan[c.lab]={from:f,to:to};render()}
    else{var L=labById(c.lab),it=itemById(L,c.item);if(it){snap();it.from=f;it.due=to;persist();render()}}
  }
}
function applyRange(lab,all,clear){
  var L=labById(lab),pl=plan[lab];if(!L)return;
  var tg=L.items.filter(function(i2){return all||(sel[lab]&&sel[lab][i2.id])});
  if(!tg.length||(!clear&&!pl))return;
  snap();
  tg.forEach(function(i2){if(clear){i2.from="";i2.due=""}else{i2.from=pl.from;i2.due=pl.to}});
  persist();render();
  toast(clear?"Auto dates restored for "+tg.length+(tg.length===1?" product":" products"):"Dates added to "+tg.length+(tg.length===1?" product":" products"));
}

function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return false;var t=arr[i];arr[i]=arr[j];arr[j]=t;return true}

document.addEventListener("click",function(e){
  var t=e.target;
  if(cal.contains(t)){calClick(t);return}
  if(menu.contains(t)){var pb=t.closest("[data-pick]");if(pb)applyPick(+pb.getAttribute("data-pick"));return}
  var b=t.closest("[data-act]"),act=b&&b.getAttribute("data-act");
  if(!menu.hidden){var same=b&&b===menuAnchor;closeMenu();if(same)return}
  if(!cal.hidden){var sameC=b&&b===calAnchor;closeCal();if(sameC)return}
  if(!b)return;
  if(act==="save"){saveToFile();return}
  if(act==="latest"){getLatest(false);return}
  var lid=b.getAttribute("data-lab"),iid=b.getAttribute("data-item"),p=+b.getAttribute("data-p"),L=lid&&lid!=="all"?labById(lid):null,it=L?itemById(L,iid):null;

  if(act==="focus"){focus=lid;render();return}
  if(act==="range"&&L){var pp=plan[lid];openCal(b,{k:"plan",lab:lid,from:pp&&pp.from,to:pp&&pp.to});return}
  if(act==="rowdate"&&it){openCal(b,{k:"item",lab:lid,item:iid,from:(it.due&&it.from)?it.from:"",to:(it.due&&it.from)?it.due:""});return}
  if(act==="applySel"&&L){applyRange(lid,false,false);return}
  if(act==="applyAll"&&L){applyRange(lid,true,false);return}
  if(act==="clearSel"&&L){applyRange(lid,false,true);return}
  if(act==="cell"&&it){openMenu(b,{k:"cell",lab:lid,item:iid,p:p},S.people[p]+": "+it.name,stage(it,p));return}
  if(act==="row"&&it){openMenu(b,{k:"row",lab:lid,item:iid},"Set everyone on "+it.name,-1);return}
  if(act==="col"&&L){openMenu(b,{k:"col",lab:lid,p:p},"Set all of "+L.name+" for "+S.people[p],-1);return}
  if(act==="lab"&&L){openMenu(b,{k:"lab",lab:lid},"Set all of "+L.name+" for everyone",-1);return}

  if(act==="undo"){
    if(!hist.length)return;
    S=norm(JSON.parse(hist.pop()));persist();render();document.getElementById("toast").hidden=true;return;
  }
  if(act==="reset"){
    snap();S.labs.forEach(function(l){l.items.forEach(function(i2){i2.p=[]})});persist();render();toast("All progress cleared");return;
  }
  if(act==="edit"){edit=!edit;render();return}
  if(act==="dayStep"&&L){snap();L.days=Math.max(1,Math.min(60,L.days+(+b.getAttribute("data-d"))));persist();render();return}
  if(act==="addPerson"){snap();S.people.push("New person");persist();pendingFocus='[data-f="person"][data-p="'+(S.people.length-1)+'"]';render();return}
  if(act==="delPerson"){
    if(S.people.length<2)return;
    snap();var nm=S.people[p];S.people.splice(p,1);S.labs.forEach(function(l){l.items.forEach(function(i2){if(i2.p.length>p)i2.p.splice(p,1)})});
    persist();render();toast("Removed "+nm);return;
  }
  if(act==="addItem"&&L){snap();var ni={id:uid(),name:"New product",note:"",from:"",due:"",p:[]};L.items.push(ni);persist();pendingFocus='[data-f="name"][data-item="'+ni.id+'"]';render();return}
  if(act==="delItem"&&L&&it){snap();L.items.splice(L.items.indexOf(it),1);persist();render();toast("Deleted "+(it.name||"product"));return}
  if(act==="upItem"&&L&&it){snap();move(L.items,L.items.indexOf(it),-1);persist();render();return}
  if(act==="dnItem"&&L&&it){snap();move(L.items,L.items.indexOf(it),1);persist();render();return}
  if(act==="addLab"){
    snap();var used={};S.labs.forEach(function(l){used[l.c]=1});var c=0;while(used[c]&&c<7)c++;
    var nl={id:uid(),name:"New lab",c:c,days:5,items:[]};S.labs.push(nl);focus=nl.id;persist();pendingFocus='[data-f="labname"][data-lab="'+nl.id+'"]';render();return;
  }
  if(act==="delLab"&&L){snap();S.labs.splice(S.labs.indexOf(L),1);if(focus===lid)focus="all";persist();render();toast("Deleted "+L.name);return}
  if(act==="upLab"&&L){snap();move(S.labs,S.labs.indexOf(L),-1);persist();render();return}
  if(act==="dnLab"&&L){snap();move(S.labs,S.labs.indexOf(L),1);persist();render();return}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!menu.hidden)closeMenu();if(!cal.hidden)closeCal()}});

/* typing: update state without re-rendering so focus is kept */
document.addEventListener("focusin",function(e){var t=e.target,f=t.getAttribute&&t.getAttribute("data-f");
  if((f==="name"||f==="note"||f==="labname"||f==="person")&&!t.getAttribute("data-s")){snap();t.setAttribute("data-s","1")}});
document.addEventListener("focusout",function(e){var t=e.target;if(t.removeAttribute)t.removeAttribute("data-s")});
document.addEventListener("input",function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute("data-f");if(!f)return;
  var L=labById(t.getAttribute("data-lab")),it=L?itemById(L,t.getAttribute("data-item")):null;
  if((f==="name"||f==="note")&&it)it[f]=t.value;

document.addEventListener("change",function(e){

  var f=t.getAttribute&&t.getAttribute("data-f");if(!f)return;

  if(f==="days"&&L){snap();L.days=Math.max(1,Math.min(60,parseInt(t.value,10)||L.days));persist();render()}
  if(f==="sel"&&it){sel[L.id]=sel[L.id]||{};if(t.checked)sel[L.id][it.id]=true;else delete sel[L.id][it.id];pendingFocus='[data-f="sel"][data-item="'+it.id+'"]';render()}
  if(f==="selall"&&L){sel[L.id]={};if(t.checked)L.items.forEach(function(i2){sel[L.id][i2.id]=true});pendingFocus='[data-f="selall"][data-lab="'+L.id+'"]';render()}
});

if(restored)toast("Restored your unsaved changes from this browser.",true);

/* ---------- combine edits made by different people ---------- */
function mergeState(b,m,t){
  var same=function(x,y){return JSON.stringify(x)===JSON.stringify(y)};
  var pick=function(bv,mv,tv){return same(mv,bv)?tv:mv};
  function mergeList(bA,mA,tA,fn){
    var bi={},mi={},ti={},out=[],order=[];
    (bA||[]).forEach(function(x){bi[x.id]=x});(mA||[]).forEach(function(x){mi[x.id]=x});(tA||[]).forEach(function(x){ti[x.id]=x});
    (tA||[]).forEach(function(x){order.push(x.id)});
    (mA||[]).forEach(function(x){if(!ti[x.id]&&!bi[x.id])order.push(x.id)});
    order.forEach(function(id){
      var bb=bi[id],mm=mi[id],tt=ti[id];
      if(tt&&mm&&bb)out.push(fn(bb,mm,tt));
      else if(tt&&!mm&&!bb)out.push(tt);
      else if(tt&&mm&&!bb)out.push(tt);
      else if(!tt&&mm&&!bb)out.push(mm);
      /* deleted by either side: stays deleted */
    });
    return out;
  }
  function item(bb,mm,tt){
    var o={id:tt.id,name:pick(bb.name,mm.name,tt.name),note:pick(bb.note,mm.note,tt.note),from:pick(bb.from,mm.from,tt.from),due:pick(bb.due,mm.due,tt.due),p:[]};
    var n=Math.max(bb.p.length,mm.p.length,tt.p.length);
    for(var i=0;i<n;i++)o.p.push(pick(bb.p[i]||0,mm.p[i]||0,tt.p[i]||0));
    return o;
  }
  function lab(bb,mm,tt){return{id:tt.id,name:pick(bb.name,mm.name,tt.name),c:pick(bb.c,mm.c,tt.c),days:pick(bb.days,mm.days,tt.days),items:mergeList(bb.items,mm.items,tt.items,item)}}
  return{v:4,start:pick(b.start,m.start,t.start),people:pick(b.people,m.people,t.people),labs:mergeList(b.labs,m.labs,t.labs,lab)};
}

/* ---------- saving into the HTML file itself ---------- */
function embedJson(rev,state){return JSON.stringify({docId:docId,rev:rev,savedAt:new Date().toISOString(),state:state}).replace(/</g,"\\u003c")}
function buildHtml(src,rev,state){
  var re=/(<script type="application\/json" id="tracker-data">)[\s\S]*?(<\/script>)/;
  if(!re.test(src))throw new Error("that file has no tracker data section");
  return src.replace(re,function(m,a,b){return a+embedJson(rev,state)+b});
}
function parseEmbedded(txt){
  var m=txt.match(/<script type="application\/json" id="tracker-data">([\s\S]*?)<\/script>/);
  if(!m)return null;
  try{return JSON.parse(m[1])}catch(e){return null}
}
function updateSaveBar(){
  var el=document.getElementById("savebar");
  if(dirty){el.hidden=false;el.innerHTML='<span>You have unsaved changes</span><button class="btn primary" data-act="save">Save to file</button>';document.body.classList.add("dirty")}
  else{el.hidden=true;document.body.classList.remove("dirty")}
  var fn=document.querySelector(".filenote");if(fn)fn.textContent=fileNote();
}
function softRender(){
  var a=document.activeElement;
  if(a&&a.matches&&a.matches("#app input[data-f]")&&a.type!=="checkbox"){setTimeout(softRender,1500);return}
  render();
}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("tracker-fs",1);r.onupgradeneeded=function(){r.result.createObjectStore("h")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function rememberHandle(h){try{var d=await idb();d.transaction("h","readwrite").objectStore("h").put(h,docId)}catch(e){}}
async function recallHandle(){
  try{var d=await idb();return await new Promise(function(res){var q=d.transaction("h").objectStore("h").get(docId);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})}catch(e){return null}
}
async function pickFile(){
  var hs=await window.showOpenFilePicker({multiple:false,types:[{description:"Tracker page",accept:{"text/html":[".html",".htm"]}}]});
  var h=hs[0],txt=await (await h.getFile()).text(),emb=parseEmbedded(txt);
  if(!emb||(emb.docId&&emb.docId!==docId))throw new Error("that is not this tracker file. Choose the file this page was opened from.");
  return h;
}
async function ensureAccess(h,mode){
  var o={mode:mode};
  if((await h.queryPermission(o))==="granted")return true;
  return (await h.requestPermission(o))==="granted";
}
function downloadCopy(){
  var rev=loadedRev+1,out=buildHtml(SRC,rev,S);
  var blob=new Blob([out],{type:"text/html"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=fileName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
  loadedRev=rev;base=clone(S);dirty=false;lastSavedAt=new Date().toISOString();
  try{localStorage.removeItem(DKEY)}catch(e){}
  render();updateSaveBar();
  toast("Downloaded an updated copy. Replace the old file with it.",true);
}
async function saveToFile(){
  if(saving)return;saving=true;
  try{
    if(!FS_OK){downloadCopy();return}
    if(!fileHandle){fileHandle=await pickFile();await rememberHandle(fileHandle)}
    if(!(await ensureAccess(fileHandle,"readwrite")))throw new Error("permission to change the file was not given");
    var txt=await (await fileHandle.getFile()).text(),disk=parseEmbedded(txt),merged=false;
    if(disk&&disk.docId&&disk.docId!==docId)throw new Error("the file on disk is a different tracker");
    if(disk&&disk.rev>loadedRev){var th=norm(disk.state);S=mergeState(base,S,th);base=th;loadedRev=disk.rev;merged=true;hist=[]}
    var rev=loadedRev+1,out=buildHtml(txt,rev,S);
    var w=await fileHandle.createWritable();await w.write(out);await w.close();
    loadedRev=rev;base=clone(S);dirty=false;lastSavedAt=new Date().toISOString();
    try{localStorage.removeItem(DKEY)}catch(e){}
    render();updateSaveBar();
    toast(merged?"Saved. Changes made by someone else were combined in.":"Saved to "+fileHandle.name+".",true);
  }catch(e){
    if(e&&e.name==="AbortError")return;
    if(e&&e.name==="SecurityError"){FS_OK=false;try{downloadCopy()}catch(e2){toast("Could not save: "+e2.message,true)}return}
    toast("Could not save: "+((e&&e.message)||e),true);
  }finally{saving=false}
}
function pickViaInput(){
  return new Promise(function(res){
    var i=document.createElement("input");i.type="file";i.accept=".html,.htm";
    i.onchange=function(){var f=i.files&&i.files[0];if(!f){res(null);return}f.text().then(res)};
    i.click();
  });
}
function applyDisk(txt,silent){
  var disk=parseEmbedded(txt);
  if(!disk||(disk.docId&&disk.docId!==docId)){if(!silent)toast("That file is not this tracker.",true);return}
  if(disk.rev<=loadedRev){if(!silent)toast("You already have the latest version.",true);return}
  var th=norm(disk.state);
  S=mergeState(base,S,th);base=th;loadedRev=disk.rev;hist=[];lastSavedAt=disk.savedAt||lastSavedAt;
  dirty=JSON.stringify(S)!==JSON.stringify(base);
  if(dirty)persist();else{try{localStorage.removeItem(DKEY)}catch(e){}}
  softRender();updateSaveBar();
  toast(silent?"Updated with changes saved by someone else.":"Loaded the latest changes.",true);
}
async function getLatest(silent){
  try{
    var txt=null;
    if(FS_OK&&fileHandle){
      if(silent){if((await fileHandle.queryPermission({mode:"read"}))!=="granted")return}
      else if(!(await ensureAccess(fileHandle,"read")))return;
      txt=await (await fileHandle.getFile()).text();
    }else if(FS_OK&&!silent){
      fileHandle=await pickFile();await rememberHandle(fileHandle);updateSaveBar();
      txt=await (await fileHandle.getFile()).text();
    }else if(!silent){txt=await pickViaInput()}
    if(txt)applyDisk(txt,silent);
  }catch(e){if(!silent&&!(e&&e.name==="AbortError"))toast("Could not read the file: "+((e&&e.message)||e),true)}
}
if(FS_OK)recallHandle().then(function(h){if(h){fileHandle=h;updateSaveBar()}});
setInterval(function(){if(!document.hidden&&fileHandle&&!saving)getLatest(true)},20000);
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});
})();
